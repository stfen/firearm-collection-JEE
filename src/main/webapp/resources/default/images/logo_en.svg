<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" preserveAspectRatio="xMinYMid meet">
  <rect width="100%" height="100%" fill="none"/>
  <g fill="none" stroke="#2c3e50" stroke-width="4">
    <!-- simple stylized sight + text to represent firearms app -->
    <circle cx="80" cy="80" r="48" stroke="#1f618d" stroke-width="6" fill="#e9f2fb"/>
    <circle cx="80" cy="80" r="24" stroke="#1f618d" stroke-width="4" fill="#ffffff"/>
    <line x1="20" y1="80" x2="140" y2="80" stroke="#1f618d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(160,40)" fill="#1f618d" font-family="Segoe UI, Roboto, Arial" font-size="36">
    <text x="0" y="40">Firearm</text>
    <text x="0" y="80" font-size="18" fill="#557da0">Collection</text>
  </g>
</svg>
