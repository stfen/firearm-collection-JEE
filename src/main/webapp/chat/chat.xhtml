<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core" template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">#{messages['chat.title']}</h5>
                    </div>
                    <div class="card-body">
                        <div id="chat-box"
                            style="height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; background-color: #f9f9f9;">
                            <!-- Messages will appear here -->
                        </div>

                        <h:form id="chatForm">
                            <div class="mb-3">
                                <h:outputLabel for="recipient" value="#{messages['chat.send_to']}"
                                    styleClass="form-label" />
                                <h:selectOneMenu id="recipient" value="#{chatView.recipient}" styleClass="form-select">
                                    <f:selectItem itemLabel="#{messages['chat.everyone']}" itemValue="" />
                                    <f:selectItems value="#{chatView.users}" var="user" itemLabel="#{user}"
                                        itemValue="#{user}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="mb-3">
                                <h:inputTextarea id="message" value="#{chatView.message}" rows="3"
                                    styleClass="form-control" placeholder="#{messages['chat.message_placeholder']}" />
                            </div>

                            <h:commandButton value="#{messages['chat.send']}" action="#{chatView.sendMessage}"
                                styleClass="btn btn-primary">
                                <f:ajax execute="@form" render="message" onevent="onMessageSent" />
                            </h:commandButton>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            var ws;
            var chatBox = document.getElementById("chat-box");

            function connect() {
                var host = window.location.host;
                var path = window.location.pathname.substring(0, window.location.pathname.indexOf("/", 1));
                var url = "ws://" + host + path + "/ws/chat";

                ws = new WebSocket(url);

                ws.onmessage = function (event) {
                    var msg = JSON.parse(event.data);
                    var sender = msg.sender;
                    var content = msg.content;
                    var timestamp = msg.timestamp; // You might want to format this

                    var messageElement = document.createElement("div");
                    messageElement.style.marginBottom = "5px";
                    messageElement.innerHTML = "<strong>" + sender + ":</strong> " + content;

                    chatBox.appendChild(messageElement);
                    chatBox.scrollTop = chatBox.scrollHeight;
                };

                ws.onopen = function (event) {
                    console.log("Connected to Chat WebSocket");
                };

                ws.onclose = function (event) {
                    console.log("Disconnected from Chat WebSocket");
                };
            }

            function onMessageSent(data) {
                if (data.status === "success") {
                    // Optional: Clear the textarea if JSF doesn't do it fast enough or for better UX
                    // document.getElementById("chatForm:message").value = ""; 
                    // Note: JSF AJAX render="message" should handle clearing the value in the backing bean and updating the view
                }
            }

            window.onload = connect;
        </script>
    </ui:define>

</ui:composition>
