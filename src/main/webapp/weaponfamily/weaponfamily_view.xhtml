<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{weaponFamilyView.idParam}" />
        <f:viewAction action="#{weaponFamilyView.init}" />
    </f:metadata>

    <ui:define name="content">
        <section class="card-like">
            <header class="article-header">
                <h2 class="article-title">#{messages['family.details']}</h2>
            </header>

            <h:panelGrid columns="2" rendered="#{not empty weaponFamilyView.weaponFamily}" styleClass="form-row">
                <h:outputLabel value="#{messages['list.name']}:" />
                <h:outputText value="#{weaponFamilyView.weaponFamily.name}" />

                <h:outputLabel value="#{messages['list.range']}:" />
                <h:outputText value="#{weaponFamilyView.weaponFamily.optimalRange}" />

                <h:outputLabel value="#{messages['list.ammo']}:" />
                <h:outputText value="#{weaponFamilyView.weaponFamily.ammoType}" />
            </h:panelGrid>

            <h3>#{messages['family.firearms']}</h3>
            <h:form id="firearmsForm">
                <h:panelGroup id="firearmsTable">
                    <h:dataTable value="#{weaponFamilyView.firearms}" var="f" styleClass="table-clean">
                        <h:column>
                            <f:facet name="header">#{messages['firearm.name']}</f:facet>
                            <h:link value="#{f.name}" outcome="/firearm/firearm_view.xhtml">
                                <f:param name="id" value="#{f.id}" />
                            </h:link>
                        </h:column>
                        <h:column>
                            <f:facet name="header">#{messages['firearm.caliber']}</f:facet>
                            #{f.caliber}
                        </h:column>
                        <h:column>
                            <f:facet name="header">#{messages['firearm.capacity']}</f:facet>
                            #{f.magazineCapacity}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Version</f:facet>
                            #{f.version}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Created</f:facet>
                            <h:outputText value="#{f.creationDateTime}" converter="localDateTimeConverter" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">Last Modified</f:facet>
                            <h:outputText value="#{f.lastModificationDateTime}" converter="localDateTimeConverter" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">#{messages['list.show']}</f:facet>
                            <h:link outcome="/firearm/firearm_edit.xhtml" value="#{messages['firearm.edit']}"
                                styleClass="btn small ghost">
                                <f:param name="id" value="#{f.id}" />
                            </h:link>
                            &#160;|&#160;
                            <h:commandButton value="#{messages['firearm.delete']}" styleClass="btn small"
                                action="#{weaponFamilyView.deleteFirearm(f.id)}"
                                onclick="return confirm('#{messages['firearm.delete.confirm']}');">
                                <f:ajax execute="@this" render="firearmsTable" />
                            </h:commandButton>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>

            <h:link outcome="/firearm/firearm_create.xhtml" value="#{messages['family.add_firearm']}" styleClass="btn">
                <f:param name="weaponFamilyId" value="#{weaponFamilyView.weaponFamily.id}" />
            </h:link>

            <h:panelGroup rendered="#{empty weaponFamilyView.weaponFamily}">
                <p class="text-danger">#{messages['firearm.not_found']}</p>
            </h:panelGroup>
        </section>
    </ui:define>

</ui:composition>
