<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="weaponfamily" name="css/weaponfamily_list.css"/>

        <article class="text--justified">
            <header><h2>Lista kategorii (Weapon Families)</h2></header>

            <h:dataTable value="#{weaponFamilyList.weaponFamilies.weaponFamilies}" var="wf"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">Ikona</f:facet>
                    <h:graphicImage styleClass="portrait rounded-circle" alt="Family icon"
                                    value="/resources/default/images/logo.svg"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Nazwa</f:facet>
                    <h:outputText value="#{wf.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Optymalny zasięg</f:facet>
                    <h:outputText value="#{wf.optimalRange}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Ammo</f:facet>
                    <h:outputText value="#{wf.ammoType}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Pokaż</f:facet>
                    <h:link outcome="/weaponfamily/weaponfamily_view.xhtml" value="Pokaż">
                        <f:param name="id" value="#{wf.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Edytuj</f:facet>
                    <h:link outcome="/weaponfamily/weaponfamily_edit.xhtml" value="Edytuj">
                        <f:param name="id" value="#{wf.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Usuń</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Usuń"
                                         action="#{weaponFamilyList.delete(wf.id)}"
                                         onclick="if(!confirm('Usuń kategorię wraz z elementami?')) return false;"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/weaponfamily/weaponfamily_create.xhtml" value="Utwórz nową kategorię"/>
                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
