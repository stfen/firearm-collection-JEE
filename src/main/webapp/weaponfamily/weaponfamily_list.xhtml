<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">

        <article class="card-like">
            <header class="article-header">
                <h2 class="article-title">#{messages['list.title']}</h2>
            </header>

            <h:dataTable value="#{weaponFamilyList.weaponFamilies.weaponFamilies}" var="wf" styleClass="table-clean"
                headerClass="bg-light">
                <h:column>
                    <f:facet name="header">#{messages['list.name']}</f:facet>
                    <h:outputText value="#{wf.name}" />
                </h:column>

                <h:column>
                    <f:facet name="header">#{messages['list.range']}</f:facet>
                    <h:outputText value="#{wf.optimalRange}" />
                </h:column>

                <h:column>
                    <f:facet name="header">#{messages['list.ammo']}</f:facet>
                    <h:outputText value="#{wf.ammoType}" />
                </h:column>

                <h:column>
                    <f:facet name="header">#{messages['list.show']}</f:facet>
                    <h:link outcome="/weaponfamily/weaponfamily_view.xhtml" value="#{messages['list.show']}">
                        <f:param name="id" value="#{wf.id}" />
                    </h:link>
                </h:column>

                <h:column rendered="#{request.isUserInRole('admin')}">
                    <f:facet name="header">#{messages['list.delete']}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{messages['list.delete']}"
                            action="#{weaponFamilyList.delete(wf.id)}"
                            onclick="if(!confirm(&quot;#{messages['list.delete.confirm']}&quot;)) return false;" />
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
