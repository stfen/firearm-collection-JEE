<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core" template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="weaponFamilyId" value="#{firearmForm.weaponFamilyIdParam}" />
        <f:viewAction action="#{firearmForm.init}" />
    </f:metadata>

    <ui:define name="content">
        <h2>#{messages['firearm.create']}</h2>
        <h:form id="firearmForm" styleClass="card-like">
            <h:messages globalOnly="true" errorClass="error-message" infoClass="info-message" />
            
            <h:panelGrid columns="3" styleClass="form-row">
                <h:outputLabel value="#{messages['firearm.name']}" for="name" />
                <h:inputText id="name" value="#{firearmForm.name}" required="true" styleClass="" />
                <h:message for="name" errorClass="error-message" />

                <h:outputLabel value="#{messages['firearm.caliber']}" for="caliber" />
                <h:inputText id="caliber" value="#{firearmForm.caliber}" required="true" />
                <h:message for="caliber" errorClass="error-message" />

                <h:outputLabel value="#{messages['firearm.capacity']}" for="capacity" />
                <h:inputText id="capacity" value="#{firearmForm.magazineCapacity}" required="true" />
                <h:message for="capacity" errorClass="error-message" />

                <h:outputLabel value="#{messages['firearm.production']}" for="production" />
                <h:inputText id="production" value="#{firearmForm.productionDate}" />
                <h:message for="production" errorClass="error-message" />

                <h:outputLabel value="#{messages['firearm.category']}" for="category" />
                <h:selectOneMenu id="category" value="#{firearmForm.weaponFamily}" converter="weaponFamilyConverter" required="true" styleClass="">
                    <f:selectItems value="#{firearmForm.availableWeaponFamilies}" var="wf" itemValue="#{wf}"
                        itemLabel="#{wf.name}" />
                </h:selectOneMenu>
                <h:message for="category" errorClass="error-message" />
            </h:panelGrid>

            <div class="form-actions">
                <h:commandButton value="#{messages['firearm.save']}" styleClass="btn" action="#{firearmForm.save}" />
                <h:link value="#{messages['firearm.cancel']}" styleClass="btn secondary"
                    outcome="/weaponfamily/weaponfamily_list.xhtml" />
            </div>
        </h:form>
    </ui:define>

</ui:composition>
